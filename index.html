# goals
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои цели</title>
<style>
  :root {
    --bg: #eef2f0;
    --paper: #ffffff;
    --ink: #1c2b26;
    --muted: #6b7c75;
    --line: #d5ded9;
    --accent: #1f6f5c;
    --late: #b3382c;
    --soon: #b7791f;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14201c;
      --paper: #1c2b26;
      --ink: #e8f0ec;
      --muted: #98aaa2;
      --line: #2f423b;
      --accent: #4fc3a1;
      --late: #ef7d70;
      --soon: #e3b25a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    margin-bottom: 20px;
  }
  @media (max-width: 520px) { form { grid-template-columns: 1fr; } }
  input, button { font: inherit; }
  input[type="text"], input[type="date"] {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--paper);
    color: var(--ink);
  }
  button.add {
    padding: 10px 18px;
    border: 0;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .count { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  li input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; }
  .title { font-size: 1.05rem; word-break: break-word; }
  .due { font-size: .85rem; color: var(--muted); }
  .due.late { color: var(--late); }
  .due.soon { color: var(--soon); }
  li.done .title { text-decoration: line-through; color: var(--muted); }
  li.done .due { color: var(--accent); }
  .del {
    border: 0; background: none; color: var(--muted);
    font-size: 1.3rem; cursor: pointer; padding: 4px 8px; border-radius: 6px;
  }
  .del:hover { color: var(--late); }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; }
</style>
</head>
<body>
<main>
  <h1>Мои цели</h1>
  <p class="sub">Запишите цель, укажите срок и отметьте галочкой, когда она выполнена.</p>

  <form id="form">
    <input type="text" id="title" placeholder="Например: прочитать 12 книг" maxlength="120" required aria-label="Цель">
    <input type="date" id="date" required aria-label="Дедлайн">
    <button class="add" type="submit">Добавить цель</button>
  </form>

  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  <p class="count" id="count"></p>

  <ul id="list"></ul>
</main>

<script>
  const KEY = "goals-v1";
  let goals = [];
  try { goals = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { goals = []; }

  const list = document.getElementById("list");
  const form = document.getElementById("form");
  const titleEl = document.getElementById("title");
  const dateEl = document.getElementById("date");
  const bar = document.getElementById("bar");
  const count = document.getElementById("count");

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(goals)); } catch (e) {}
  }

  function daysLeft(dateStr) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const d = new Date(dateStr + "T00:00:00");
    return Math.round((d - today) / 86400000);
  }

  function dueText(g) {
    const date = new Date(g.date + "T00:00:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
    if (g.done) return { text: "Выполнено · срок был " + date, cls: "" };
    const n = daysLeft(g.date);
    if (n < 0) return { text: "Просрочено · " + date, cls: "late" };
    if (n === 0) return { text: "Сегодня · " + date, cls: "soon" };
    if (n <= 3) return { text: "Осталось дней: " + n + " · " + date, cls: "soon" };
    return { text: "До " + date, cls: "" };
  }

  function render() {
    goals.sort((a, b) => a.done - b.done || a.date.localeCompare(b.date));
    list.innerHTML = "";
    if (!goals.length) {
      list.innerHTML = '<li class="empty" style="display:block">Целей пока нет. Добавьте первую выше.</li>';
    }
    goals.forEach(g => {
      const li = document.createElement("li");
      if (g.done) li.className = "done";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = g.done;
      cb.setAttribute("aria-label", "Цель выполнена: " + g.title);
      cb.onchange = () => { g.done = cb.checked; save(); render(); };

      const box = document.createElement("div");
      const t = document.createElement("div");
      t.className = "title";
      t.textContent = g.title;
      const info = dueText(g);
      const d = document.createElement("div");
      d.className = "due " + info.cls;
      d.textContent = info.text;
      box.append(t, d);

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.setAttribute("aria-label", "Удалить цель: " + g.title);
      del.onclick = () => { goals = goals.filter(x => x.id !== g.id); save(); render(); };

      li.append(cb, box, del);
      list.append(li);
    });

    const done = goals.filter(g => g.done).length;
    bar.style.width = goals.length ? (done / goals.length * 100) + "%" : "0";
    count.textContent = goals.length ? "Выполнено " + done + " из " + goals.length : "";
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const title = titleEl.value.trim();
    if (!title || !dateEl.value) return;
    goals.push({ id: Date.now(), title, date: dateEl.value, done: false });
    save();
    form.reset();
    titleEl.focus();
    render();
  });

  render();
</script>
</body>
</html>
